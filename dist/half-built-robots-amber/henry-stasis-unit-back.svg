<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300">
  <!-- Stasis containment unit, back layer: carry handle, bolted housing,
       window tint, dashed empty frame (open state), indicator panel,
       vented plinth. The hinged glass door lives in
       henry-stasis-unit-front.svg; a living Henry sits between the two
       layers. State classes are documented in henry-stasis-unit.css.
       The window tint is the containment field color (#3cc7dd in the
       canonical palette, recolored per variant), not the accent. -->
  <path d="M 100 45 Q 130 22 160 45" fill="none" stroke="#555555" stroke-width="5" stroke-linecap="round"/>
  <rect x="35" y="45" width="190" height="185" rx="14" fill="#ffffff" stroke="#555555" stroke-width="5"/>
  <g fill="#555555">
    <circle cx="52" cy="62" r="4"/>
    <circle cx="208" cy="62" r="4"/>
    <circle cx="52" cy="213" r="4"/>
    <circle cx="208" cy="213" r="4"/>
  </g>
  <rect class="unit-tint" x="57" y="74" width="116" height="116" rx="6" fill="#3cc7dd" fill-opacity="0.16"/>
  <rect class="unit-frame-empty" x="55" y="72" width="120" height="120" rx="8" fill="none" stroke="#555555" stroke-width="3" stroke-dasharray="9 7"/>
  <rect x="185" y="78" width="26" height="62" rx="5" fill="#ffffff" stroke="#555555" stroke-width="3"/>
  <circle class="unit-light-holding" cx="198" cy="92" r="5"/>
  <circle class="unit-light-alert" cx="198" cy="108" r="5"/>
  <rect x="192" y="120" width="12" height="4" fill="#555555"/>
  <rect x="192" y="128" width="12" height="4" fill="#555555" opacity="0.4"/>
  <rect x="50" y="230" width="160" height="24" rx="5" fill="#efefef" stroke="#555555" stroke-width="5"/>
  <g stroke="#555555" stroke-width="4" stroke-linecap="round">
    <line x1="105" y1="236" x2="105" y2="248"/>
    <line x1="122" y1="236" x2="122" y2="248"/>
    <line x1="139" y1="236" x2="139" y2="248"/>
  </g>
</svg>
