<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300">
  <!-- Stasis containment unit, front layer: the hinged glass door (pane,
       sheen, cracks, scars, tape) plus hinge dots. Overlays the back
       layer 1:1; state classes are documented in henry-stasis-unit.css. -->
  <g class="unit-door">
    <rect x="55" y="72" width="120" height="120" rx="8" fill="#ffffff" fill-opacity="0.18" stroke="#555555" stroke-width="4"/>
    <line x1="68" y1="84" x2="96" y2="112" stroke="#ffffff" stroke-width="7" opacity="0.5" stroke-linecap="round"/>
    <path class="unit-crack-a" d="M 60 76 l 18 14 -6 10 16 12" fill="none" stroke="#555555" stroke-width="2.5" stroke-linejoin="round"/>
    <path class="unit-crack-b" d="M 172 188 l -14 -16 8 -8 -18 -14" fill="none" stroke="#555555" stroke-width="2.5" stroke-linejoin="round"/>
    <path class="unit-scar-a" d="M 60 76 l 18 14 -6 10 16 12" fill="none" stroke="#555555" stroke-width="2" stroke-dasharray="4 4" stroke-linejoin="round"/>
    <path class="unit-scar-b" d="M 172 188 l -14 -16 8 -8 -18 -14" fill="none" stroke="#555555" stroke-width="2" stroke-dasharray="4 4" stroke-linejoin="round"/>
    <g class="unit-tape" fill="#1890ff" opacity="0.55">
      <rect x="48" y="96" width="64" height="13" transform="rotate(38 80 102)"/>
      <rect x="48" y="120" width="64" height="13" transform="rotate(-38 80 126)"/>
      <rect x="130" y="164" width="64" height="13" transform="rotate(-34 162 170)"/>
    </g>
  </g>
  <circle class="unit-hinge" cx="60" cy="187" r="3.5" fill="#555555"/>
  <circle class="unit-hinge" cx="70" cy="196" r="3.5" fill="#555555"/>
</svg>
